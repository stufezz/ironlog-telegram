<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0e0f12" />
  <meta name="description" content="IronLog — дневник силовых тренировок в Telegram" />
  <meta property="og:title" content="IronLog — Telegram Mini App" />
  <meta property="og:description" content="Программы, подходы, таймер отдыха и прогресс — прямо в Telegram." />
  <meta property="og:image" content="./og.png" />
  <link rel="icon" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <title>IronLog — Telegram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#f4f4f1;--card:rgba(255,255,255,.88);--ink:#0e0f12;--muted:#75777b;--line:rgba(14,15,18,.09);--inv:#fff;--shadow:0 18px 50px rgba(0,0,0,.12)}
    *{box-sizing:border-box} body{margin:0;background:#d9d9d7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;display:grid;place-items:center;min-height:100vh}
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--card:rgba(255,255,255,.075);--ink:#f4f4f1;--muted:#9a9ca0;--line:rgba(255,255,255,.1);--inv:#101114;--shadow:0 18px 50px rgba(0,0,0,.38)}body{background:#050506}}
    :root[data-theme="light"]{--bg:#f4f4f1;--card:rgba(255,255,255,.88);--ink:#0e0f12;--muted:#75777b;--line:rgba(14,15,18,.09);--inv:#fff;--shadow:0 18px 50px rgba(0,0,0,.12)}:root[data-theme="dark"]{--bg:#0e0f12;--card:rgba(255,255,255,.075);--ink:#f4f4f1;--muted:#9a9ca0;--line:rgba(255,255,255,.1);--inv:#101114;--shadow:0 18px 50px rgba(0,0,0,.38)}
    button,input{font:inherit}.phone{width:390px;height:844px;max-width:100vw;max-height:100vh;background:var(--bg);position:relative;overflow:hidden;box-shadow:var(--shadow)}
    .network{position:absolute;inset:0;opacity:.09;pointer-events:none;background-image:radial-gradient(circle at 12% 12%,var(--ink) 0 2px,transparent 2.5px),radial-gradient(circle at 38% 19%,var(--ink) 0 1.5px,transparent 2px),radial-gradient(circle at 79% 11%,var(--ink) 0 2px,transparent 2.5px),radial-gradient(circle at 23% 54%,var(--ink) 0 2px,transparent 2.5px),radial-gradient(circle at 66% 48%,var(--ink) 0 1.5px,transparent 2px),radial-gradient(circle at 91% 71%,var(--ink) 0 2px,transparent 2.5px),linear-gradient(22deg,transparent 49.8%,var(--ink) 50%,transparent 50.2%);background-size:210px 240px,190px 220px,240px 260px,260px 270px,180px 230px,220px 280px,250px 310px}
    .screen{position:absolute;inset:0;overflow-y:auto;padding:54px 18px 108px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.hidden{display:none!important}
    .eyebrow{font-size:11px;font-weight:900;letter-spacing:2.1px;color:var(--muted);text-transform:uppercase}.title{font-size:34px;line-height:1;font-weight:950;letter-spacing:-1.3px;margin:5px 0 20px}.row{display:flex;align-items:center}.spread{justify-content:space-between}.gap{gap:10px}
    .iconbtn,.addbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:44px;height:44px;border-radius:15px;font-weight:800}.addbtn{border:0;background:var(--ink);color:var(--inv);border-radius:50%;font-size:24px}.danger{color:#e33d4f}#theme{border-radius:50%}
    .hero{height:190px;border-radius:29px;background:var(--ink);color:var(--inv);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;margin:18px 0}
    .hero:before{content:"";position:absolute;inset:0;opacity:.2;background:linear-gradient(23deg,transparent 49.5%,var(--inv) 50%,transparent 50.5%);background-size:90px 80px}.hero:after{content:"━━\A ━━━━\A  ━━";white-space:pre;position:absolute;right:24px;top:21px;font-family:monospace;line-height:10px}.hero h1{font-size:31px;line-height:.98;margin:0 0 10px;font-weight:950;letter-spacing:-1px;z-index:1}.hero p{font-size:13px;opacity:.7;margin:0;z-index:1}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;backdrop-filter:blur(16px)}
    .week{display:grid;grid-template-columns:repeat(7,1fr);padding:7px}.day{border:0;color:var(--ink);background:transparent;border-radius:16px;padding:8px 0;font-size:11px}.day b{display:block;font-size:16px;margin:5px 0}.day.active{background:var(--ink);color:var(--inv)}.day.done{background:#3bd67b;color:#0b1710;font-weight:900}.dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}
    .metric b{font-size:17px}.metric small,.muted{display:block;color:var(--muted);font-size:12px;margin-top:2px}.section{font-size:11px;font-weight:900;letter-spacing:1.6px;color:var(--muted);margin:22px 0 12px}.primary{border:0;border-radius:16px;background:var(--ink);color:var(--inv);height:50px;padding:0 17px;font-weight:900;font-size:12px;letter-spacing:1.4px}.full{width:100%}
    nav{position:absolute;z-index:20;bottom:8px;left:16px;right:16px;height:69px;border-radius:25px;padding:7px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.16);display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}
    nav button{border:0;border-radius:18px;background:transparent;color:var(--muted);font-size:9px;font-weight:700}.navicon{display:block;width:19px;height:19px;margin:0 auto 4px}.navicon svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.active{background:var(--ink);color:var(--inv)}
    .template{transition:transform .16s ease,opacity .16s ease,border-color .16s ease}.template.dragging{opacity:.5;transform:scale(.98)}.template.drop-target{border-color:#3bd67b}.drag-handle{cursor:grab;touch-action:none}.drag-handle:active{cursor:grabbing}.reorder-hint{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:700;margin:-7px 0 13px}.template h2{font-size:25px;margin:8px 0 6px;letter-spacing:-.5px}.chips{display:flex;gap:6px;overflow:hidden;margin:14px 0}.chip{padding:7px 10px;background:var(--line);border-radius:50px;font-size:11px;font-weight:700;white-space:nowrap}.index{font:800 11px monospace;color:var(--muted)}
    .modal{position:absolute;z-index:50;inset:0;background:var(--bg);padding:52px 18px 30px;overflow:auto}.modalhead{position:sticky;top:-52px;background:var(--bg);padding:12px 0 16px;z-index:2}.label{font-size:10px;font-weight:900;letter-spacing:1.4px;color:var(--muted);margin:18px 0 7px}.field{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:15px;outline:0}.exercise-draft{padding:15px;border:1px solid var(--line);border-radius:20px;background:var(--card);margin-bottom:10px}.triples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.triples label{text-align:center;font-size:9px;font-weight:900;color:var(--muted)}.triples input{display:block;width:100%;margin-top:5px;text-align:center;padding:10px;border:0;border-radius:10px;background:var(--line);color:var(--ink)}
    .session-top{padding-top:6px}.history-alert{border-radius:50%;font-size:18px;font-family:ui-rounded,system-ui;font-weight:950}.exercise h2{font-size:18px;margin:0}.sethead,.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr 38px 30px;gap:6px;align-items:center;text-align:center}.sethead{font-size:9px;font-weight:900;color:var(--muted);margin:14px 0 7px}.setrow{margin-bottom:7px}.setrow input{min-width:0;width:100%;height:38px;border:0;background:var(--line);color:var(--ink);border-radius:10px;text-align:center;font-family:monospace;font-weight:700}.check{height:38px;border:0;border-radius:11px;background:var(--line);color:var(--ink)}.check.done{background:var(--ink);color:var(--inv)}.delete-set{width:30px;height:38px;border:0;border-radius:10px;background:color-mix(in srgb,#e33d4f 10%,transparent);color:#e33d4f;font-weight:900}.finish{position:absolute;z-index:30;bottom:88px;left:18px;right:18px}.previous-row{display:grid;grid-template-columns:30px repeat(3,1fr);gap:8px;text-align:center;align-items:center;padding:9px 4px;margin-top:7px;border-radius:11px;background:var(--line);font-family:monospace;font-weight:700}.previous-head{font-size:9px;font-weight:900;color:var(--muted);background:transparent;padding-top:2px}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calday{border:0;background:transparent;color:var(--ink);height:44px;border-radius:13px}.calday.active{background:var(--ink);color:var(--inv)}.calday.done{background:#3bd67b;color:#0b1710;font-weight:900}.chart-tabs{display:flex;gap:7px;overflow:auto;margin:13px 0}.chart-tab{border:0;border-radius:999px;background:var(--line);color:var(--ink);height:34px;padding:0 11px;white-space:nowrap;font-size:11px;font-weight:800}.chart-tab.active{background:var(--ink);color:var(--inv)}.weight-chart{width:100%;height:175px;display:block;overflow:visible}.weight-chart .grid{stroke:var(--ink);stroke-opacity:.08;stroke-width:1}.weight-chart .line{fill:none;stroke:#3bd67b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.weight-chart .point{fill:#3bd67b;stroke:var(--card);stroke-width:3}.weight-chart text{fill:var(--muted);font-size:9px;font-family:monospace}.delta-up{color:#24bd68}
    .empty{text-align:center;padding:30px 15px;color:var(--muted);font-size:13px}.history-row{display:flex;gap:13px;align-items:center;width:100%;color:var(--ink);text-align:left}.history-row .open-arrow{margin-left:auto;font-size:18px;color:var(--muted)}.datebox{width:45px;height:50px;background:var(--line);border-radius:14px;display:grid;place-items:center;font-weight:900}.datebox small{display:block;font-size:9px;color:var(--muted)}.file-export{width:100%;display:flex;align-items:center;gap:12px;color:var(--ink);text-align:left}.file-export .file-box{width:38px;height:38px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-size:17px}.file-export b{font-size:11px;letter-spacing:1px}.file-export .share-arrow{margin-left:auto;color:var(--muted);font-size:18px}
    .program-option{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:space-between;text-align:left}.greencheck{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--line);border:1px solid var(--line);font-size:15px;font-weight:950;color:transparent;transition:.18s ease}.program-option[aria-checked="true"] .greencheck{background:#3bd67b;border-color:#3bd67b;color:#0b1710;transform:scale(1.03)}.editor-note{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;margin:12px 0;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--muted);font-size:11px;font-weight:650;line-height:1.35}
    .theme-options{display:grid;gap:10px}.theme-option{width:100%;height:54px;border:1px solid var(--line);border-radius:17px;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800}.theme-option.active{background:var(--ink);color:var(--inv)}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric-big b{font-size:30px}.metric-big:last-child{text-align:right}.schedule-label{display:inline-flex;gap:7px;align-items:center}.planned-dot{width:5px;height:5px;border-radius:50%;background:currentColor;display:block;margin:2px auto 0}.day-session{display:flex;align-items:center;gap:12px;margin-top:14px}.day-session .session-main{flex:1;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;gap:12px;text-align:left;padding:0}.scheduledStart{width:100%;border:0;background:transparent;color:var(--ink);text-align:left}.day-session .open-arrow{margin-left:auto}.session-symbol{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--line);display:grid;place-items:center}.picker-list{display:grid;gap:10px}.picker-row{width:100%;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:15px;display:flex;gap:12px;align-items:center;text-align:left}.note-field{width:100%;min-height:70px;resize:vertical}.restbar{position:absolute;z-index:25;left:18px;right:18px;bottom:84px;height:58px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(20px);box-shadow:var(--shadow);display:flex;align-items:center;gap:11px;padding:0 15px}.restbar b{font-family:monospace;margin-left:auto}.restbar button{width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--ink)}.session-duration{font-family:monospace;font-weight:900}.exercise-note{margin-top:10px}.action-menu{display:flex;gap:8px}.confirm-card{max-width:340px;margin:auto}.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.segment{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:10px 5px;font-size:11px}.segment.active{background:var(--ink);color:var(--inv)}
    .toast{position:absolute;z-index:80;left:50%;top:calc(18px + var(--tg-content-safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--inv);padding:10px 16px;border-radius:20px;font-size:12px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
    .file-action{width:100%;display:flex;align-items:center;gap:13px;text-align:left;color:var(--ink)}.file-action+.file-action{margin-top:10px}.file-icon{width:43px;height:43px;flex:0 0 43px;border-radius:14px;display:grid;place-items:center;background:var(--line);font-size:19px}.file-action strong,.file-action small{display:block}.file-action small{color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}.telegram-user{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:14px;border-radius:16px;background:var(--line)}.telegram-user img{width:34px;height:34px;border-radius:50%;object-fit:cover}.telegram-user span{font-size:12px;font-weight:800}.privacy-note{font-size:11px;line-height:1.5;color:var(--muted)}
    @media(max-width:600px){body{display:block;background:var(--bg)}.phone{width:100vw;height:100svh;max-width:none;max-height:none;box-shadow:none}.screen{padding-top:calc(28px + var(--tg-content-safe-area-inset-top,0px));padding-bottom:calc(108px + var(--tg-content-safe-area-inset-bottom,0px))}.modal{padding-top:calc(28px + var(--tg-content-safe-area-inset-top,0px));padding-bottom:calc(30px + var(--tg-content-safe-area-inset-bottom,0px))}nav{bottom:calc(8px + var(--tg-content-safe-area-inset-bottom,0px))}.finish{bottom:calc(88px + var(--tg-content-safe-area-inset-bottom,0px))}}
  </style>

<body>
<main class="phone" id="phone"><div class="network"></div><div id="app"></div></main>
<script src="./app.js"></script>
<script type="text/plain" id="legacy-app-source">
const starterTemplates=[
  {name:'Ноги + плечи',note:'Среда',exercises:[]},
  {name:'Грудь + бицепс',note:'Понедельник',exercises:[]},
  {name:'Спина + трицепс',note:'Пятница',exercises:[]}
];
const STORAGE_KEY='ironlog-telegram-v1';
const telegram=window.Telegram?.WebApp;
const telegramSupports=version=>telegram?.isVersionAtLeast?.(version)===true;
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch{return null}}
const saved=loadSaved();
const state={screen:'home',templates:Array.isArray(saved?.templates)?saved.templates:starterTemplates,sessions:Array.isArray(saved?.sessions)?saved.sessions:[],active:null,restEnd:Number(saved?.restEnd)>Date.now()?Number(saved.restEnd):0,chartProgram:null,chartExercise:null,editingCompleted:false,calendarCursor:new Date(),selectedDate:new Date()};
state.active=[...state.sessions].reverse().find(session=>!session.done)??null;
function snapshot(){return {version:1,app:'IronLog Telegram',exportedAt:new Date().toISOString(),templates:state.templates,sessions:state.sessions,restEnd:state.restEnd}}
function persist(){let data=JSON.stringify(snapshot());localStorage.setItem(STORAGE_KEY,data);if(telegramSupports('9.0'))try{telegram.DeviceStorage.setItem(STORAGE_KEY,data,()=>{})}catch{}}
const $=s=>document.querySelector(s), app=$('#app');
const navIcons={home:'<svg viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2v8.3a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',calendar:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M7 3v4M17 3v4M3.5 10h17"/></svg>',workouts:'<svg viewBox="0 0 24 24"><path d="M2.5 9v6M5.5 7v10M8.5 10v4M15.5 10v4M18.5 7v10M21.5 9v6M8.5 12h7"/></svg>',history:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'};
function nav(active){return `<nav>${[['home','Сегодня'],['calendar','Календарь'],['workouts','Тренировки'],['history','История']].map(([id,t])=>`<button data-nav="${id}" class="${active===id?'active':''}"><span class="navicon">${navIcons[id]}</span>${t}</button>`).join('')}</nav>`}
function header(kicker,title,plus=false){return `<div class="row spread"><div><div class="eyebrow">${kicker}</div><div class="title">${title}</div></div>${plus?'<button class="addbtn" id="addTemplate" aria-label="Создать программу">+</button>':''}</div>`}
function home(){let last=state.sessions.at(-1),todayPlan=state.templates.find(t=>(t.note||'').toLowerCase()==='вторник'),heroTitle=todayPlan?`СЕГОДНЯ<br>${todayPlan.name.toUpperCase()}`:'СЕГОДНЯ<br>ОТДЫХ',heroText=todayPlan?'Тренировка по плану. Упражнения можно добавить перед стартом или во время занятия.':'День восстановления. Следующая тренировка — в среду.';return `<section class="screen"><div><div class="row spread"><div class="eyebrow">TRAINING / LOG</div><button class="iconbtn" id="theme" aria-label="Переключить тему" style="width:40px;height:40px;border-radius:14px">◐</button></div><div class="title" style="margin-top:-3px;white-space:nowrap;font-size:31px">Вторник, 18 августа</div></div><div class="hero"><h1>${heroTitle}</h1><p>${heroText}</p></div><div class="card week">${['15','16','17','18','19','20','21'].map((d,i)=>`<button class="day ${i===3?'active':''}">${['СБ','ВС','ПН','ВТ','СР','ЧТ','ПТ'][i]}<b>${d}</b>${i===3&&last?'<i class="dot"></i>':''}</button>`).join('')}</div>${last?`<div class="card row spread"><div><div class="eyebrow">${last.done?'ГОТОВО':'ТРЕНИРОВКА СЕГОДНЯ'}</div><b>${last.name}</b><small class="muted">${last.exercises.length} упражнений · ${countDone(last)} подходов</small></div><button class="iconbtn" id="openLast">→</button></div>`:`<div class="card row spread"><div><b>Сегодня свободно</b><span class="muted">Выбери программу и начни</span></div><button class="addbtn" data-nav="workouts">+</button></div>`}<div class="section">МОИ ТРЕНИРОВКИ</div><div class="card" style="padding-top:5px;padding-bottom:5px">${state.templates.map((t,i)=>`<button data-nav="workouts" class="row spread" style="width:100%;border:0;border-bottom:${i<state.templates.length-1?'1px solid var(--line)':'0'};background:transparent;color:var(--ink);padding:14px 2px;text-align:left"><span class="index" style="width:28px">${String(i+1).padStart(2,'0')}</span><span style="flex:1"><span class="eyebrow" style="font-size:9px">${t.note}</span><b style="display:block;margin-top:3px">${t.name}</b><small class="muted">Упражнения добавишь сам</small></span><span class="muted" style="font-size:18px">›</span></button>`).join('')}</div><div class="section">ЭТА НЕДЕЛЯ</div><div class="card"><div class="metric"><b>${state.sessions.filter(s=>s.done).length}</b><small>тренировки</small></div></div></section>${nav('home')}`}
function workouts(){return `<section class="screen">${header('ПРОГРАММЫ','Тренировки',true)}${state.templates.length>1?'<div class="reorder-hint"><span>↕</span><span>Удерживай значок ↕ и перетаскивай программу</span></div>':''}${state.templates.length?state.templates.map((t,i)=>`<article class="card template" data-template-index="${i}"><div class="row spread"><span class="index">${String(i+1).padStart(2,'0')}</span><div class="row gap"><button class="iconbtn drag-handle" data-index="${i}" draggable="true" aria-label="Переместить ${t.name}">↕</button><button class="iconbtn editTemplate" data-index="${i}" aria-label="Редактировать ${t.name}">✎</button><button class="iconbtn danger deleteTemplate" data-index="${i}" aria-label="Удалить ${t.name}">×</button></div></div><h2>${t.name.toUpperCase()}</h2><span class="muted">${t.note||'Сохранённая программа'}</span><div class="chips">${t.exercises.slice(0,3).map(e=>`<span class="chip">${e.name}</span>`).join('')}</div><button class="primary full start" data-index="${i}">НАЧАТЬ <span style="float:right">↗</span></button></article>`).join(''):`<div class="card empty"><div style="font-size:34px;color:var(--ink)">·—·—·</div><h3 style="color:var(--ink)">Собери первую программу</h3><p>Добавь упражнения, подходы, повторения и целевой RIR.</p><button class="primary" id="emptyAdd">СОЗДАТЬ ПРОГРАММУ</button></div>`}</section>${nav('workouts')}`}

function bindTemplateReordering(){

    card.ondrop=e=>{e.preventDefault();let source=dragSourceIndex??+e.dataTransfer.getData('text/plain'),rect=card.getBoundingClientRect(),after=e.clientY>rect.top+rect.height/2;clearTargets();if(Number.isInteger(source))reorderTemplate(source,+card.dataset.templateIndex,after)};

function openDeleteCompletedDialog(){app.insertAdjacentHTML('beforeend',`<div class="modal" style="display:grid;align-content:center"><div class="card"><div class="eyebrow">ПОДТВЕРЖДЕНИЕ</div><h2>Удалить тренировку?</h2><p class="muted" style="font-size:13px;margin-bottom:20px">Запись исчезнет из истории и графика. Программа останется.</p><div class="row gap"><button class="iconbtn" id="cancelDeleteCompleted" style="flex:1;width:auto">Отмена</button><button class="primary danger" id="confirmDeleteCompleted" style="flex:1;background:#e33d4f;color:white">Удалить</button></div></div></div>`);$('#cancelDeleteCompleted').onclick=()=>$('.modal').remove();$('#confirmDeleteCompleted').onclick=()=>{let index=state.sessions.indexOf(state.active);if(index>=0)state.sessions.splice(index,1);state.active=null;state.editingCompleted=false;state.screen='history';persist();render();toast('Тренировка удалена')}}
function openPreviousWorkout(){let active=state.active,previous=[...state.sessions].reverse().find(s=>s!==active&&s.template===active.template&&s.done);let content=previous?`<div class="card"><div class="eyebrow">ПРОШЛАЯ ТРЕНИРОВКА</div><h2 style="margin:7px 0">18 августа 2026</h2><span>${countDone(previous)} подходов</span></div>${previous.exercises.map(e=>{let done=e.sets.filter(x=>x.done);return `<div class="card"><div class="row spread"><b>${e.name.toUpperCase()}</b><span class="index">${done.length} подх.</span></div>${done.length?`<div class="previous-row previous-head"><span>#</span><span>ВЕС</span><span>ПОВТ</span><span>RIR</span></div>${done.map((x,i)=>`<div class="previous-row"><span>${i+1}</span><span>${x.weight??0}</span><span>${x.reps??0}</span><span>${x.rir??0}</span></div>`).join('')}`:'<span class="muted" style="margin-top:12px">Нет отмеченных подходов</span>'}</div>`}).join('')}`:`<div class="card empty"><div style="font-size:38px">◷</div><h3 style="color:var(--ink)">Прошлой тренировки пока нет</h3><p>Заверши эту программу хотя бы один раз — здесь появятся веса, повторы, подходы и RIR.</p></div>`;app.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modalhead row spread"><button class="iconbtn" id="closePreviousWorkout">×</button><b>${active.name}</b><span class="index">ИСТОРИЯ</span></div>${content}</div>`);$('#closePreviousWorkout').onclick=()=>$('.modal').remove()}
function openEditor(editIndex=null){let editing=editIndex!==null,existing=editing?state.templates[editIndex]:null;app.insertAdjacentHTML('beforeend',editor(editing));$('#tname').value=existing?.name??'';$('#tnote').value=existing?.note??'';let source=existing?.exercises?.length?existing.exercises:[{name:'',sets:3,reps:10,rir:2}],n=source.length;$('#drafts').innerHTML=source.map((e,i)=>draft(i,e)).join('');bindDraftDelete();$('#addExercise').onclick=()=>{$('#drafts').insertAdjacentHTML('beforeend',draft(n++));bindDraftDelete()};$('#cancel').onclick=()=>$('.modal').remove();$('#saveTemplate').onclick=()=>{let name=$('#tname').value.trim();let ex=[...document.querySelectorAll('.exercise-draft')].map(d=>({name:d.querySelector('.ename').value.trim(),sets:Math.min(10,Math.max(1,+d.querySelector('.sets').value||1)),reps:Math.min(50,Math.max(1,+d.querySelector('.reps').value||1)),rir:Math.min(5,Math.max(0,+d.querySelector('.rir').value||0))})).filter(e=>e.name);if(!name){toast('Добавь название программы');return}let updated={name,note:$('#tnote').value.trim(),exercises:ex};if(editing)state.templates[editIndex]=updated;else state.templates.push(updated);persist();$('.modal').remove();render();toast(editing?'Программа обновлена':'Программа сохранена')}}
function bindDraftDelete(){document.querySelectorAll('.removeDraft').forEach(b=>b.onclick=()=>{if(document.querySelectorAll('.exercise-draft').length===1){toast('В программе нужно хотя бы одно упражнение');return}b.closest('.exercise-draft').remove()})}
function deleteTemplate(index){state.templates.splice(index,1);state.sessions.forEach(s=>{if(s.template===index)s.template=null;else if(s.template>index)s.template--});persist();render();toast('Программа удалена')}
function escapeHTML(value){return String(value).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function openSessionExerciseEditor(){app.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modalhead row spread"><button class="iconbtn" id="cancelSessionExercise">×</button><b>Добавить упражнение</b><button class="primary" id="saveSessionExercise">ДОБАВИТЬ</button></div><div class="label">УПРАЖНЕНИЕ</div><input class="field" id="sessionExerciseName" placeholder="Например: Тяга верхнего блока"><div class="label">РАБОЧАЯ СХЕМА</div><div class="exercise-draft"><div class="triples"><label>ПОДХОДЫ<input id="sessionExerciseSets" type="number" min="1" max="10" value="3"></label><label>ПОВТОРЫ<input id="sessionExerciseReps" type="number" min="1" max="50" value="10"></label><label>RIR<input id="sessionExerciseRir" type="number" min="0" max="5" value="2"></label></div></div><button class="program-option" id="saveExerciseToTemplate" role="checkbox" aria-checked="true" style="margin-top:16px"><span><b>Добавить в программу</b><small class="muted">Сохранить для следующего запуска</small></span><span class="greencheck">✓</span></button></div>`);let programChoice=$('#saveExerciseToTemplate');programChoice.onclick=()=>programChoice.setAttribute('aria-checked',programChoice.getAttribute('aria-checked')==='true'?'false':'true');$('#cancelSessionExercise').onclick=()=>$('.modal').remove();$('#saveSessionExercise').onclick=()=>{let name=$('#sessionExerciseName').value.trim(),sets=Math.max(1,+$('#sessionExerciseSets').value||1),reps=Math.max(1,+$('#sessionExerciseReps').value||1),rir=Math.min(5,Math.max(0,+$('#sessionExerciseRir').value||0));if(!name){toast('Введи название упражнения');return}let exercise={name,sets:Array.from({length:sets},()=>({weight:0,reps,rir,done:false}))};state.active.exercises.push(exercise);if(programChoice.getAttribute('aria-checked')==='true'&&state.active.template!=null)state.templates[state.active.template].exercises.push({name,sets,reps,rir});persist();$('.modal').remove();render();toast('Упражнение добавлено')}}
function start(i){let t=state.templates[i],previous=[...state.sessions].reverse().find(s=>s.template===i&&s.done);let exercises=t.exercises.map(e=>({name:e.name||'Упражнение',sets:Array.from({length:Math.max(1,+e.sets||1)},(_,si)=>{let p=previous?.exercises.find(x=>x.name===e.name)?.sets[si];return {weight:p?.weight??0,reps:p?.reps??e.reps??10,rir:p?.rir??e.rir??2,done:false}})}));let s={name:t.name,template:i,exercises,done:false,date:todayISO(),startedAt:Date.now(),durationSeconds:0,notes:''};state.sessions.push(s);state.active=s;state.editingCompleted=false;state.screen='session';persist();if(telegramSupports('6.1'))telegram.HapticFeedback.impactOccurred('medium');render()}
function countDone(s){return s.exercises.flatMap(e=>e.sets).filter(x=>x.done).length}
function todayISO(){return new Date().toISOString().slice(0,10)}
async function deliverFile(file,title){
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title});return}catch(error){if(error?.name==='AbortError')return}}
  let url=URL.createObjectURL(file),link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
async function exportCompletedWorkouts(){
  let done=state.sessions.filter(s=>s.done),escape=value=>`"${String(value??'').replaceAll('"','""')}"`,rows=[];
  done.forEach(session=>{let sessionRows=[];session.exercises.forEach(exercise=>exercise.sets.forEach((set,index)=>{if(set.done)sessionRows.push([session.date||todayISO(),session.name,exercise.name,index+1,set.weight??0,set.reps??0,set.rir??0,session.durationSeconds?Math.round(session.durationSeconds/60):'',session.notes||''].map(escape).join(','))}));if(!sessionRows.length)sessionRows.push([session.date||todayISO(),session.name,'','','','','',session.durationSeconds?Math.round(session.durationSeconds/60):'',session.notes||''].map(escape).join(','));rows.push(...sessionRows)});
  let csv='\uFEFFДата,Тренировка,Упражнение,Подход,Вес (кг),Повторы,RIR,Длительность (мин),Заметка\n'+rows.join('\n');
  await deliverFile(new File([csv],`IronLog-history-${todayISO()}.csv`,{type:'text/csv;charset=utf-8'}),'IronLog — история тренировок');toast('Файл CSV готов')
}
async function exportBackup(){let file=new File([JSON.stringify(snapshot(),null,2)],`IronLog-backup-${todayISO()}.json`,{type:'application/json'});await deliverFile(file,'IronLog — резервная копия');toast('Резервная копия готова')}
function openFileManager(){
  let user=telegram?.initDataUnsafe?.user,avatar=user?.photo_url?`<img src="${escapeHTML(user.photo_url)}" alt="">`:'<span class="file-icon">◇</span>',userBlock=user?`<div class="telegram-user">${avatar}<span>${escapeHTML([user.first_name,user.last_name].filter(Boolean).join(' '))}</span></div>`:'';
  app.insertAdjacentHTML('beforeend',`<div class="modal"><div class="modalhead row spread"><button class="iconbtn" id="closeFiles">×</button><b>Файлы IronLog</b><span class="index">LOCAL</span></div>${userBlock}<button class="card file-action" id="exportBackup"><span class="file-icon">⇩</span><span><strong>Резервная копия</strong><small>Все программы и тренировки в одном JSON-файле</small></span></button><button class="card file-action" id="exportCsv"><span class="file-icon">≡</span><span><strong>История CSV</strong><small>Таблица с весами, повторами и RIR</small></span></button><label class="card file-action" for="importBackup"><span class="file-icon">⇧</span><span><strong>Восстановить из файла</strong><small>Выбери ранее сохранённый IronLog-backup.json</small></span></label><input id="importBackup" type="file" accept="application/json,.json" hidden><p class="privacy-note">Данные хранятся локально на устройстве и не отправляются во внешние сервисы.</p></div>`);
  $('#closeFiles').onclick=()=>$('.modal').remove();$('#exportBackup').onclick=exportBackup;$('#exportCsv').onclick=exportCompletedWorkouts;$('#importBackup').onchange=importBackupFile
}
async function importBackupFile(event){
  let file=event.target.files?.[0];if(!file)return;
  try{let data=JSON.parse(await file.text());if(!Array.isArray(data.templates)||!Array.isArray(data.sessions))throw new Error('invalid');if(!confirm('Заменить текущие данны данными из файла?'))return;state.templates=data.templates;state.sessions=data.sessions;state.active=null;state.screen='home';persist();render();toast('Данные восстановлены')}catch{let message='Не удалось прочитать файл IronLog.';if(telegram?.showAlert)telegram.showAlert(message);else alert(message)}
}
function applyLiveDate(){
  if(state.screen!=='home')return;let now=new Date(),title=document.querySelector('.screen .title');if(title)title.textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(now).replace(/^./,x=>x.toUpperCase());let weekdays=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],plan=state.templates.find(t=>(t.note||'').toLowerCase().includes(weekdays[now.getDay()].toLowerCase())),hero=document.querySelector('.hero h1'),heroText=document.querySelector('.hero p');if(hero)hero.innerHTML=plan?`СЕГОДНЯ<br>${escapeHTML(plan.name.toUpperCase())}`:'СЕГОДНЯ<br>ОТДЫХ';if(heroText)heroText.textContent=plan?'Тренировка определена автоматически по дню недели.':'День восстановления. Следующая тренировка уже в плане.';document.querySelectorAll('.week .day').forEach((button,index)=>{let date=new Date(now);date.setDate(now.getDate()+index-3);button.childNodes[0].textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(date).slice(0,2).toUpperCase();let number=button.querySelector('b');if(number)number.textContent=date.getDate();button.classList.toggle('active',index===3)})
}
function localISO(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function shiftCalendarMonth(delta){state.calendarCursor=new Date(state.calendarCursor.getFullYear(),state.calendarCursor.getMonth()+delta,1);state.selectedDate=new Date(state.calendarCursor);render()}
function applyCalendarLive(){
  if(state.screen!=='calendar')return;
  let now=new Date(),cursor=state.calendarCursor,year=cursor.getFullYear(),month=cursor.getMonth(),selected=state.selectedDate,selectedISO=localISO(selected),daysInMonth=new Date(year,month+1,0).getDate(),first=(new Date(year,month,1).getDay()+6)%7,calendarNode=document.querySelector('.calendar'),monthRow=document.querySelectorAll('.screen>.row.spread')[1],monthTitle=monthRow?.querySelector('b');
  if(monthTitle)monthTitle.textContent=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(cursor).replace(/^./,x=>x.toUpperCase());
  let arrows=monthRow?.querySelectorAll('button');if(arrows?.[0])arrows[0].onclick=()=>shiftCalendarMonth(-1);if(arrows?.[1])arrows[1].onclick=()=>shiftCalendarMonth(1);
  if(calendarNode){let doneDates=new Set(state.sessions.filter(s=>s.done&&s.date).map(s=>s.date));calendarNode.innerHTML=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(x=>`<span class="eyebrow" style="font-size:8px">${x}</span>`).join('')+'<i></i>'.repeat(first)+Array.from({length:daysInMonth},(_,index)=>{let day=index+1,date=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,isSelected=date===selectedISO,done=doneDates.has(date),isToday=date===localISO(now);return `<button class="calday ${isSelected?'active':''} ${done?'done':''}" data-cal-date="${date}" aria-label="${day}${isToday?', сегодня':''}">${day}${done?' ✓':''}</button>`}).join('');calendarNode.querySelectorAll('[data-cal-date]').forEach(button=>button.onclick=()=>{let [y,m,d]=button.dataset.calDate.split('-').map(Number);state.selectedDate=new Date(y,m-1,d);applyCalendarLive()})}
  let detail=document.querySelectorAll('.screen>.card')[1],daySessions=state.sessions.map((session,index)=>({session,index})).filter(item=>item.session.date===selectedISO);if(detail){detail.innerHTML=`<div class="row spread"><div><b>${new Intl.DateTimeFormat('ru-RU',{weekday:'long'}).format(selected).replace(/^./,x=>x.toUpperCase())}</b><span class="muted">${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(selected)}</span></div>${state.templates.length?'<button class="addbtn" data-nav="workouts">+</button>':''}</div>${daySessions.length?daySessions.map(({session,index})=>`<div class="row spread" style="margin-top:18px"><div><b>${escapeHTML(session.name)}</b><span class="muted">${session.done?'Тренировка завершена':'Запланировано'}</span></div>${session.done?'':`<button class="iconbtn danger" data-remove-calendar-session="${index}" aria-label="Убрать тренировку">×</button>`}</div>`).join(''):'<div class="empty">На этот день ничего не запланировано</div>'}`;detail.querySelector('[data-nav]')?.addEventListener('click',()=>{state.screen='workouts';render()});detail.querySelectorAll('[data-remove-calendar-session]').forEach(button=>button.onclick=()=>{let removed=state.sessions[+button.dataset.removeCalendarSession];state.sessions.splice(+button.dataset.removeCalendarSession,1);if(state.active===removed)state.active=null;persist();render();toast('Тренировка убрана из календаря')})}
}
function applyHistoryDates(){
  if(state.screen!=='history')return;let done=state.sessions.filter(s=>s.done);document.querySelectorAll('.openHistory .datebox').forEach((box,index)=>{let session=done[index],date=session?.date?new Date(`${session.date}T12:00:00`):new Date(),day=box.childNodes[0];if(day)day.textContent=String(date.getDate());let month=box.querySelector('small');if(month)month.textContent=new Intl.DateTimeFormat('ru-RU',{month:'short'}).format(date).replace('.','').toUpperCase()})
}
function applySessionDate(){
  if(state.screen!=='session'||!state.active)return;let heading=document.querySelector('.session-top + .card h3'),date=state.active.date?new Date(`${state.active.date}T12:00:00`):new Date();if(heading)heading.textContent=new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',weekday:'long'}).format(date).replace(/^./,x=>x.toUpperCase())
}
function restText(){let left=Math.max(0,Math.ceil((state.restEnd-Date.now())/1000));return `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`}
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;$('#phone').append(e);setTimeout(()=>e.remove(),1600)}
function initTelegram(){
  if(!telegram)return;telegram.ready();telegram.expand();if(telegramSupports('7.7'))telegram.disableVerticalSwipes();if(telegramSupports('6.1')){telegram.setHeaderColor('bg_color');telegram.setBackgroundColor('bg_color')}
  document.addEventListener('click',event=>{if(telegramSupports('6.1')&&event.target.closest('button,label[for]'))telegram.HapticFeedback.selectionChanged()},{passive:true});
  if(!saved&&telegramSupports('9.0'))try{telegram.DeviceStorage.getItem(STORAGE_KEY,(error,value)=>{if(error||!value)return;try{let data=JSON.parse(value);if(Array.isArray(data.templates)&&Array.isArray(data.sessions)){state.templates=data.templates;state.sessions=data.sessions;render();toast('Данные Telegram загружены')}}catch{}})}catch{}
}
setInterval(()=>{if(!state.restEnd)return;let left=Math.max(0,Math.ceil((state.restEnd-Date.now())/1000));let el=document.querySelector('.resttime');if(el)el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(left===0){state.restEnd=0;persist();toast('Пора начинать следующий подход')}},250);
render();
initTelegram();
  </script>
